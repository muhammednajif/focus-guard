name: focus_guard
description: A premium Android focus‑guard app.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  fl_chart: ^0.65.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  share_plus: ^7.2.2
  path_provider: ^2.1.1
  screenshot: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/